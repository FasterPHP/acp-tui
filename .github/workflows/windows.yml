# The Windows check, on demand only (windows-support D10): there is no push or pull_request trigger,
# so it costs nothing until someone asks. `bun run test:windows` starts it for the current branch
# with `gh workflow run` and waits for the result; it is the final check before a push to main.
name: windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to test (default: the ref the run was started on)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Bun 1.4.3 is the version the Windows work was verified on (Bun.spawn({ terminal }) over ConPTY);
      # keep it exact, like the dependencies, and raise it deliberately.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install
        run: bun install --frozen-lockfile

      # The parallel pass only: everything but the *.timing.test.ts files. The timing tests' bounds
      # are performance targets measured on Linux; on a small Windows machine some miss them by a
      # wide margin (the file picker's first matches, the busy indicator's steps), which says
      # nothing about Windows support. The hosted runner has 4 slow vCPUs: with 4 workers PTY tests
      # starved each other (timeouts, screens read before they were drawn) where an 8-vCPU machine
      # passed them all; on it PTY tests can still read a screen before acp-tui has drawn it. So it runs
      # 2 workers, gives each test 20 s instead of Bun's 5 s, and re-runs the files with a failing
      # test once, on their own (`--retry-failed`): a failure that repeats still fails the run. Skips for
      # Windows are in the tests (`test.skipIf(WINDOWS)`) and show in the summary counts.
      - name: Test
        shell: bash
        env:
          ACP_TUI_TEST_WORKERS: "2"
        run: bun run test --parallel-only --retry-failed --timeout 20000

      - name: Typecheck
        run: bun run typecheck
